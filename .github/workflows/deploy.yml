name: Deploy Theme and Update WordPress via FTP

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Клонирование репозитория
    - name: Checkout repository
      uses: actions/checkout@v3

    # Шаг 2: Архивация папки с темой
    - name: Archive theme
      run: |
        cd wp-content/themes/
        zip -r theme.zip jfit

    # Шаг 3: Загрузка архива темы на сервер через FTP
    - name: Upload theme archive via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        local-dir: wp-content/themes/theme.zip
        server-dir: wp-content/themes/

    # Шаг 4: Удаление старой версии темы и разархивирование новой
    - name: Update theme
      run: |
        cd wp-content/themes/
        rm -rf jfit
        unzip theme.zip -d .
        rm -f theme.zip

    # Шаг 5: Обновление ядра WordPress (без wp-config.php)
    - name: Update WordPress Core via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        local-dir: wordpress/
        server-dir: /
        exclude: |
          wp-config.php

    # Шаг 6: Включение режима обслуживания
    - name: Enable maintenance mode via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        local-dir: .
        server-dir: /
        include: |
          .maintenance

    # Шаг 7: Завершение работы и удаление режима обслуживания
    - name: Disable maintenance mode via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        server-dir: /
        delete: |
          .maintenance