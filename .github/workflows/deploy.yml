name: Deploy to Dev Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Клонирование репозитория
    - name: Checkout repository
      uses: actions/checkout@v3

    # Шаг 2: Архивация плагинов и тем
    - name: Archive plugins and themes
      run: |
        cd wp-content
        zip -r plugins.zip plugins
        zip -r themes.zip themes

    # Шаг 3: Копирование архивов на сервер
    - name: Copy archives to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: wp-content/plugins.zip, wp-content/themes.zip
        target: "/var/www/chf6b5697a/www/jfit.beautiful-website.space"

    # Шаг 4: Удаление старых файлов и разархивирование новых
    - name: Update plugins and themes
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /var/www/chf6b5697a/www/jfit.beautiful-website.space
          rm -rf plugins themes
          unzip plugins.zip -d .
          unzip themes.zip -d .
          rm -f plugins.zip themes.zip

    # Шаг 5: Обновление ядра WordPress без wp-config.php
    - name: Update WordPress Core
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /www/jfit.beautiful-website.space/
          find . -type f -name "*.php" ! -name "wp-config.php" -delete
          rm -rf wp-admin wp-includes
          wget -O wordpress.zip ${{ secrets.WP_LINK }}
          unzip -o wordpress.zip -d .
          mv wordpress/* .
          rm -rf wordpress wordpress.zip

    # Шаг 6: Включение режима обслуживания
    - name: Enable maintenance mode
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: .maintenance
        target: "/www/jfit.beautiful-website.space/"

    # Шаг 7: Завершение работы и удаление режима обслуживания
    - name: Disable maintenance mode and cleanup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /www/jfit.beautiful-website.space/
          rm -f .maintenance