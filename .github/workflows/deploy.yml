name: Deploy to Dev Server via FTP

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Клонирование репозитория
    - name: Checkout repository
      uses: actions/checkout@v3

    # Шаг 2: Архивация плагинов и тем
    - name: Archive plugins and themes
      run: |
        cd wp-content
        zip -r plugins.zip plugins
        zip -r themes.zip themes

    # Шаг 3: Загрузка архивов на сервер через FTP
    - name: Upload archives via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        local-dir: wp-content/
        server-dir: /var/www/chf6b5697a/www/jfit.beautiful-website.space/wp-content/

    # Шаг 4: Удаление старых файлов и разархивирование новых
    - name: Update plugins and themes
      run: |
        cd /var/www/chf6b5697a/www/jfit.beautiful-website.space/wp-content/
        rm -rf plugins themes
        unzip plugins.zip -d .
        unzip themes.zip -d .
        rm -f plugins.zip themes.zip

    # Шаг 5: Обновление ядра WordPress (без wp-config.php)
    - name: Update WordPress Core via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        local-dir: wordpress/
        server-dir: /var/www/chf6b5697a/www/jfit.beautiful-website.space/
        exclude: |
          wp-config.php

    # Шаг 6: Включение режима обслуживания
    - name: Enable maintenance mode via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        local-dir: .
        server-dir: /var/www/chf6b5697a/www/jfit.beautiful-website.space/
        include: |
          .maintenance

    # Шаг 7: Завершение работы и удаление режима обслуживания
    - name: Disable maintenance mode via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: clio.cityhost.com.ua
        username: chf6b5697a_jfit
        password: npBlxJoruf
        protocol: ftp
        port: 21
        server-dir: /var/www/chf6b5697a/www/jfit.beautiful-website.space/
        delete: |
          .maintenance